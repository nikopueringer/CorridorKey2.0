[package]
name = "corridorkey-core"
description = "CorridorKey foundations: tensor layouts, clip geometry, temporal windows and the CubeCL compute layer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wgpu", "cuda"]
# The compute layer (CubeCL); off for crates that only need the core types.
compute = ["dep:cubecl"]
wgpu = ["compute", "cubecl/wgpu"]
cpu = ["compute", "cubecl/cpu"]
cuda = ["compute", "cubecl/cuda"]
hip = ["compute", "cubecl/hip"]

[dependencies]
cubecl = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# CubeCL pulls in getrandom; in the browser it needs the JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
