[project]
name = "corridorkey"
version = "2.0.0"
description = "CorridorKey 2.0: transformer-based video matting / green screen keying"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "transformers>=5.20.2",
    "timm>=1.0.30",
    "safetensors>=0.8.0",
    "huggingface-hub>=2.3.0",
    "einops>=0.8.2",
    "scipy>=1.18.1",
    "pillow>=13.0.0",
    "tqdm>=4.70.1",
    "utils3d",
    "openexr>=3.5.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "83bfa5bda008803f6521ce9547f94023b8afeddd" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
